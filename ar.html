<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forpin - Brochure AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }

    #ui-container {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: rgba(0,0,0,0.85); color: #fff;
      padding: 12px 22px; border-radius: 25px;
      font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;
      pointer-events: none; text-align: center; max-width: 90vw;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #back-btn {
      position: fixed; top: 15px; left: 15px; z-index: 9999;
      background: #7b2ff7; color: #fff; text-decoration: none;
      padding: 10px 16px; border-radius: 20px;
      font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>

  <script>
    AFRAME.registerComponent('brochure-ar', {
      init: function () {
        const sceneEl = this.el;
        const targetEntity = document.querySelector('[mindar-image-target]');
        const group = document.getElementById('brochure-group');
        const uiText = document.getElementById('ui-container');
        let found = false;

        targetEntity.addEventListener('targetFound', () => {
          found = true;
          uiText.innerText = "Tocca il banner per il corso o la brochure per sfogliarla";
        });
        targetEntity.addEventListener('targetLost', () => {
          found = false;
          uiText.innerText = "Inquadra la brochure per attivare la realtà aumentata";
        });

        sceneEl.addEventListener('loaded', () => {
          window.addEventListener('click', (e) => {
            if (!found) return;
            if (e.target.closest && e.target.closest('#back-btn')) return;
            const camera = sceneEl.camera;
            if (!camera) return;

            const mouse = new THREE.Vector2(
              (e.clientX / window.innerWidth) * 2 - 1,
              -(e.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const objs = Array.from(group.querySelectorAll('.clickable')).map(el => el.object3D);
            const hits = raycaster.intersectObjects(objs, true);
            if (hits.length > 0) {
              let el = hits[0].object.el;
              while (el && !el.classList.contains('clickable')) el = el.parentElement;
              if (el && el.dataset.url) window.location.href = el.dataset.url;
            }
          });
        });
      }
    });
  </script>
</head>
<body>

  <a id="back-btn" href="index.html">← Indietro</a>
  <div id="ui-container">Inquadra la brochure per attivare la realtà aumentata</div>

  <a-scene
    brochure-ar
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10; warmupTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="home-img" src="./home-project.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target: brochure (proporzioni 1036x1660 -> larghezza 1, altezza 1.602) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="brochure-group">

        <!-- Area trasparente sopra tutta la brochure -> apre la brochure completa -->
        <a-plane class="clickable"
                 data-url="https://online.fliphtml5.com/kyszr/Brochure-completa/"
                 position="0 0 0.01" width="1" height="1.602"
                 material="transparent: true; opacity: 0; side: double"></a-plane>

        <!-- Immagine home-project in AR, davanti alla brochure -> apre la pagina del corso -->
        <a-plane class="clickable"
                 data-url="https://forpin.it/corsi/project-management-avanzato-2/"
                 src="#home-img"
                 position="0 -0.45 0.05" width="1" height="0.281"
                 material="transparent: true; side: double"></a-plane>

      </a-entity>
    </a-entity>

  </a-scene>

</body>
</html>
